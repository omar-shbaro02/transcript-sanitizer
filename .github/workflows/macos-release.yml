name: macOS Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos-installer:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m spacy download en_core_web_lg

      - name: Build macOS app
        run: |
          chmod +x packaging/build_mac_app.sh packaging/build_mac_pkg.sh
          pyinstaller --noconfirm --clean TranscriptSanitizer.spec

      - name: Package macOS installer
        run: |
          export APP_VERSION="${GITHUB_REF_NAME#v}"
          packaging/build_mac_pkg.sh

      - name: Upload installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TranscriptSanitizer-macOS.pkg
